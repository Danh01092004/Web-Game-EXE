name: Update itch.io Stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch itch.io stats
        env:
          ITCH_KEY: ${{ secrets.VITE_ITCH_API_KEY }}
        run: |
          KEY=$(echo "$ITCH_KEY" | tr -d '[:space:]')
          echo "Key length: ${#KEY}"
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" "https://itch.io/api/1/${KEY}/my-games")
          echo "HTTP: $HTTP_CODE"
          cat /tmp/resp.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "API failed, skipping update"
            exit 0
          fi
          python3 scripts/fetch_stats.py /tmp/resp.json
          echo "New stats:"
          cat public/stats.json

      - name: Commit stats if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/stats.json
          git diff --staged --quiet && echo "No changes" || git commit -m "chore: update itch.io stats [skip ci]"
          git push
