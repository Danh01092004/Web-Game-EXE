name: Update itch.io Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch itch.io stats
        env:
          ITCH_KEY: ${{ secrets.VITE_ITCH_API_KEY }}
        run: |
          KEY=$(printf '%s' "$ITCH_KEY" | tr -d '[:space:]')
          echo "Key length: ${#KEY}"
          if [ -z "$KEY" ]; then
            echo "ERROR: ITCH_KEY is empty - check secret name VITE_ITCH_API_KEY"
            exit 1
          fi
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" "https://itch.io/api/1/${KEY}/my-games")
          echo "HTTP status: $HTTP_CODE"
          head -c 200 /tmp/resp.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "API returned $HTTP_CODE - skipping update"
            exit 0
          fi
          python3 scripts/fetch_stats.py /tmp/resp.json
          echo "Updated stats:"
          cat public/stats.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
