name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Fetch itch.io stats
        env:
          ITCH_KEY: ${{ secrets.VITE_ITCH_API_KEY }}
        run: |
          KEY=$(printf '%s' "$ITCH_KEY" | tr -d '[:space:]')
          echo "Key length: ${#KEY}"
          if [ -n "$KEY" ]; then
            HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" "https://itch.io/api/1/${KEY}/my-games")
            echo "HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              python3 scripts/fetch_stats.py /tmp/resp.json
            else
              python3 scripts/fetch_stats.py
            fi
          else
            python3 scripts/fetch_stats.py
          fi
          cat public/stats.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
