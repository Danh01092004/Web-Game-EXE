name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Update itch.io stats
        env:
          ITCH_KEY: ${{ secrets.VITE_ITCH_API_KEY }}
        run: |
          KEY=$(echo "$ITCH_KEY" | tr -d '[:space:]')
          echo "Fetching stats with key length: ${#KEY}"
          HTTP_STATUS=$(curl -s -o /tmp/itch_response.json -w "%{http_code}" "https://itch.io/api/1/${KEY}/my-games")
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/itch_response.json
          if [ "$HTTP_STATUS" = "200" ]; then
            python3 scripts/fetch_stats.py /tmp/itch_response.json
            echo "Stats updated:"
            cat public/stats.json
          else
            echo "API call failed, keeping existing stats.json"
            cat public/stats.json
          fi

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
